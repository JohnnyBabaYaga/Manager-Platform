// 匯出 Excel：三張可再匯入的資料表（成員 / 專案效益 / 模塊）
function exportExcel(){
  if(typeof XLSX==='undefined'){ alert('找不到 Excel 元件（xlsx.full.min.js），需與本網頁放在同一資料夾才能匯出 Excel。'); return; }
  const memRows=[['姓名','職稱','所屬團隊','工時上限%','技術模塊（、分隔）']];
  DATA.members.forEach(u=>{ const team=((DATA.teams||[]).find(t=>t.id===u.teamId)||{}).name||'';
    const skills=(u.skillModuleIds||[]).map(id=>(mod(id)||{}).name).filter(Boolean).join('、');
    memRows.push([u.name,u.title||'',team,u.capPct||100,skills]); });
  const projRows=[['專案名稱','廠區','客戶','進度%','投入人數','產出效益(萬元/年)','效益內容','負責成員（、分隔）','使用模塊（、分隔）']];
  DATA.projects.forEach(p=>{ const grp=(g(p.group)||{}).name||'';
    const mems=(p.memberIds||[]).map(id=>(mem(id)||{}).name).filter(Boolean).join('、');
    const mods=projModuleIds(p).map(id=>(mod(id)||{}).name).filter(Boolean).join('、');
    projRows.push([p.name,grp,p.customer||'',projProgress(p),projHeadcount(p),projBenefit(p),p.gains||'',mems,mods]); });
  const modRows=[['模塊名稱','分類','進度%','狀態','PM（、分隔）','預計完成','能力（、分隔）']];
  DATA.modules.forEach(m=>{ const owners=(m.ownerIds||[]).map(id=>(mem(id)||{}).name).filter(Boolean).join('、');
    modRows.push([m.name,m.category||'',m.progress||0,m.status||'',owners,m.eta||'',(m.caps||[]).join('、')]); });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(memRows), '表1_團隊成員');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(projRows), '表2_專案效益');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(modRows), '表3_模塊');
  XLSX.writeFile(wb, '部門資料-'+DATA.meta.updated+'.xlsx');
}
// One-Page 報告：可切換「專案總表 / 技術總表」，圖表沿用「總覽」樣式，可直接列印／存 PDF（協理級彙整）
function openReport(){
  const deptName=(DATA.department&&DATA.department.name)||DATA.meta.title||'部門';
  const today=DATA.meta.updated||new Date().toISOString().slice(0,10);
  const eff=deptEfficiency();
  const effGmap={}; efficiencyBy('group').forEach(e=>effGmap[e.label]=e);
  const effCmap={}; efficiencyBy('cat').forEach(e=>effCmap[e.label]=e);
  // 與「總覽」相同的長條圖
  function barChartHTML(items){
    const ticks=[100,80,60,40,20,0];
    const bars=items.map(it=>{const v=Math.max(0,Math.min(100,+it.value||0));
      return `<div class="col"><div class="bar" style="height:${v}%;background:${it.color}"><span class="v">${+it.value||0}</span></div></div>`;}).join('');
    const labs=items.map(it=>`<div class="xl">${esc(it.label)}</div>`).join('');
    return `<div class="chart"><div class="yax">${ticks.map(t=>`<span>${t}%</span>`).join('')}</div>`
      +`<div class="plot"><div class="plotarea"><div class="bars">${bars}</div></div><div class="xlabs">${labs}</div></div></div>`;
  }
  /* ===== 專案總表 ===== */
  const projs=(DATA.projects||[]).slice();
  const grpKpi=(DATA.groups||[]).map(gr=>{ const ps=projs.filter(p=>p.group===gr.id);
      const avg=ps.length?Math.round(ps.reduce((a,p)=>a+projProgress(p),0)/ps.length):0;
      const e=effGmap[gr.name];
      return {name:gr.name,color:gr.color,avg,n:ps.length,perHead:e?e.perHead:0}; }).filter(x=>x.n>0);
  const projKpiHTML=grpKpi.map(c=>`<div class="kpi" style="background:${c.color}">
      <div class="kpi-top"><span class="kpi-name">${esc(c.name)}</span><span class="kpi-pct">${c.avg}%</span></div>
      <div class="kpi-meta">${c.n} 案　｜　人均 ${c.perHead} 萬/年·人</div>
      <div class="kpi-bar"><i style="width:${c.avg}%"></i></div></div>`).join('');
  const projBarItems=projs.map(p=>({label:p.name.replace(/\(.*?\)/g,'').slice(0,12),value:projProgress(p),color:g(p.group).color}));
  const projCards=projs.map(p=>{ const prog=projProgress(p), ben=projBenefit(p), h=projHeadcount(p);
      const ph=h>0?Math.round(ben/h):0; const st=autoStatus({progress:prog,eta:p.eta});
      const pm=(p.memberIds||[]).map(id=>(mem(id)||{}).name).filter(Boolean).join('、')||'—';
      const hot=['new','warn','soon'].includes(st.cls);
      return {p,prog,ben,ph,st,pm,hot}; }).sort((a,b)=>b.ben-a.ben);
  const projCardHTML=projCards.map(o=>{ const p=o.p, gc=g(p.group).color;
    return `<div class="pcard${o.hot?' is-hot':''}">
      <div class="sc-head"><span class="sc-name">${esc(p.name)}</span><span class="sbadge st-${o.st.cls}">${o.st.icon} ${o.st.label}</span></div>
      <div class="pc-meta">${esc(g(p.group).name)}${p.customer?'｜'+esc(p.customer):''}</div>
      <div class="pc-bar"><i style="width:${o.prog}%;background:${gc}"></i></div>
      <div class="pc-stats"><span><b>${o.prog}%</b> 進度</span><span>💰 ${o.ben} 萬/年</span><span>👤 ${o.ph} 萬/年·人</span></div>
      <div class="pc-foot">PM：${esc(o.pm)}　預計：${esc(p.eta||'—')}</div></div>`; }).join('');
  const projSummary=grpKpi.map(c=>`<span class="sum-i"><i style="background:${c.color}"></i>${esc(c.name)}：${c.n} 案</span>`).join('')
    +`<span class="sum-i sum-total">總計：${projs.length} 案</span>`;
  /* ===== 技術總表 ===== */
  const cats=(DATA.moduleCats||[]).slice();
  const mods=(DATA.modules||[]).slice();
  const byCat=cats.map(c=>{ const list=mods.filter(m=>(m.category||'')===c.name);
    const pct=list.length?Math.round(list.reduce((a,m)=>a+(+m.progress||0),0)/list.length):0;
    const e=effCmap[c.name]; return {name:c.name,color:c.color,list,pct,perHead:e?e.perHead:0}; });
  const known=new Set(cats.map(c=>c.name));
  const orphan=mods.filter(m=>!known.has(m.category||''));
  if(orphan.length) byCat.push({name:'其他',color:'#8a93a6',list:orphan,perHead:0,pct:Math.round(orphan.reduce((a,m)=>a+(+m.progress||0),0)/orphan.length)});
  const techKpiHTML=byCat.map(c=>`<div class="kpi" style="background:${c.color}">
      <div class="kpi-top"><span class="kpi-name">${esc(c.name)}</span><span class="kpi-pct">${c.pct}%</span></div>

      <div class="kpi-bar"><i style="width:${c.pct}%"></i></div></div>`).join('');
  const techBarItems=[]; byCat.forEach(c=>c.list.slice().sort((a,b)=>(+b.progress||0)-(+a.progress||0)).forEach(m=>techBarItems.push({label:m.name,value:+m.progress||0,color:c.color})));
  const techCardHTML=byCat.map(c=>c.list.map(m=>{ const st=autoStatus({progress:m.progress,eta:m.eta}); const isNew=(m.status==='New'); const hot=isNew||['new','warn','soon'].includes(st.cls);

      <div class="sc-row sc-foot"><span><b>進度：${(+m.progress||0)}%</b></span><span class="sc-eta">預計：${esc(m.eta||'—')}</span></div>
    </div>`; }).join('')).join('');
  const techSummary=byCat.map(c=>`<span class="sum-i"><i style="background:${c.color}"></i>${esc(c.name)}：${c.list.length} 項</span>`).join('')
    +`<span class="sum-i sum-total">總計：${mods.length} 項</span>`;
  const css=`*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;}

/* ---------- Excel 匯入（讀取「部門資料盤點範本.xlsx」） ---------- */
function splitNames(s){ return String(s==null?'':s).split(/[、,，\n;；]+/).map(x=>x.trim()).filter(Boolean); }
function findModuleByName(n){ n=n.trim(); return DATA.modules.find(m=>m.name===n) || DATA.modules.find(m=>m.name.includes(n)||n.includes(m.name)); }
function findMemberByName(n){ n=n.trim(); return DATA.members.find(u=>u.name===n) || DATA.members.find(u=>u.name.includes(n)); }
function findProjectByName(n){ n=n.trim(); return DATA.projects.find(p=>p.name===n) || DATA.projects.find(p=>p.name.includes(n)||n.includes(p.name)); }
// 從 sheet（2D 陣列）找含關鍵字的表頭列，回傳 [{欄名:值}...]
function sheetToObjs(rows, keyHint){
  let hi=-1;
  // 表頭列需含關鍵字，且至少有 2 個非空欄（排除單格標題列）
  for(let i=0;i<Math.min(rows.length,10);i++){ const r=rows[i]||[];
    if(r.some(c=>String(c).includes(keyHint)) && r.filter(c=>String(c).trim()).length>=2){ hi=i; break; } }
  if(hi<0) return [];
  const heads=rows[hi].map(h=>String(h==null?'':h).trim());
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const row=rows[i]||[]; const o={}; let any=false;
    heads.forEach((h,j)=>{ const v=row[j]; o[h]=(v==null?'':v); if(String(v).trim()) any=true; });
    if(any) out.push(o);
  }
  return out;
}
function col(o, kw){ const k=Object.keys(o).find(k=>k.includes(kw)); return k?o[k]:''; }
function importExcel(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(typeof XLSX==='undefined'){ alert('找不到 Excel 解析元件（xlsx.full.min.js）。請確認它和本網頁在同一資料夾。'); return; }
  const rdr=new FileReader();
  rdr.onload=()=>{
    let wb; try{ wb=XLSX.read(rdr.result,{type:'array'}); }catch(err){ alert('讀取失敗，請確認是 .xlsx 檔'); return; }
    const sheet=(hint)=>{ const nm=wb.SheetNames.find(n=>hint(n)); return nm?XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,blankrows:false,defval:''}):null; };
    const log={memNew:0,memUpd:0,modNew:0,modUpd:0,projUpd:0,projSkip:[],ph:0};

    // 表1 團隊成員（含則先移除「範例」成員）
    const memSheet=sheet(n=>n.includes('成員')||n.includes('表1'));
    if(memSheet){
      const objs=sheetToObjs(memSheet,'姓名');
      if(objs.length){
        const before=DATA.members.length;
        DATA.members=DATA.members.filter(u=>!/範例/.test(u.name));
        log.ph=before-DATA.members.length;
        objs.forEach(o=>{
          const name=String(col(o,'姓名')).trim(); if(!name) return;
          const skills=[...new Set(splitNames(col(o,'技術模塊')||col(o,'專長')).map(sn=>{ let m=findModuleByName(sn); if(!m){ m={id:uid('m'),name:sn,category:'未分類',progress:0,phase:'(由Excel新增)',eta:'',status:'New',caps:[],ownerIds:[]}; DATA.modules.push(m); log.modNew++; } return m.id; }))];
          const cap=parseInt(col(o,'上限')||col(o,'Loading'))||100;
          let u=findMemberByName(name);
          if(u){ u.title=String(col(o,'職稱')).trim()||u.title; u.capPct=cap; u.skillModuleIds=skills; log.memUpd++; }
          else { DATA.members.push({id:uid('u'),name,title:String(col(o,'職稱')).trim(),teamId:(DATA.teams[0]||{}).id||'',skillModuleIds:skills,capPct:cap}); log.memNew++; }
        });
      }
    }
    // 表3 模塊修正（在成員之後，負責人名可解析）
    const modSheet=sheet(n=>(n.includes('模塊')&&!n.includes('對照'))||n.includes('表3'));
    if(modSheet){
      sheetToObjs(modSheet,'模塊名稱').forEach(o=>{
        const name=String(col(o,'模塊名稱')||col(o,'名稱')).trim(); if(!name) return;
        const owners=splitNames(col(o,'PM')||col(o,'負責')).map(n=>{const u=findMemberByName(n);return u&&u.id;}).filter(Boolean);
        const prog=col(o,'進度')!==''?(parseInt(col(o,'進度'))||0):null;
        const cat=String(col(o,'分類')).trim(); const st=String(col(o,'狀態')).trim();
        let m=findModuleByName(name);
        if(m){ if(cat)m.category=cat; if(prog!=null)m.progress=prog; if(st)m.status=st; if(owners.length)m.ownerIds=owners; log.modUpd++; }
        else { DATA.modules.push({id:uid('m'),name,category:cat||'未分類',progress:prog||0,phase:'(由Excel新增)',eta:'',status:st||'New',caps:[],ownerIds:owners}); log.modNew++; }
      });
    }
    // 表2 專案效益（match by 名稱，僅更新）
    const projSheet=sheet(n=>n.includes('效益')||n.includes('表2'));
    if(projSheet){
      sheetToObjs(projSheet,'專案').forEach(o=>{
        const name=String(col(o,'專案')).trim(); if(!name) return;
        const p=findProjectByName(name); if(!p){ log.projSkip.push(name); return; }
        const hc=col(o,'投入'); if(String(hc).trim()!=='') p.headcount=parseInt(hc)||0;
        const bf=col(o,'產出'); if(String(bf).trim()!=='') p.benefit=parseInt(bf)||0;
        const gn=col(o,'內容'); if(String(gn).trim()!=='') p.gains=String(gn).trim();
        const mems=splitNames(col(o,'負責')).map(n=>{const u=findMemberByName(n);return u&&u.id;}).filter(Boolean);
        if(mems.length) p.memberIds=mems;
        log.projUpd++;
      });
    }

    if(!memSheet&&!modSheet&&!projSheet){ alert('找不到可辨識的分頁（表1成員 / 表2專案效益 / 表3模塊）。請使用「部門資料盤點範本.xlsx」。'); return; }
    save(); render();
    alert(`匯入完成：\n　成員 新增 ${log.memNew} / 更新 ${log.memUpd}${log.ph?`（移除 ${log.ph} 筆範例）`:''}\n　模塊 新增 ${log.modNew} / 更新 ${log.modUpd}\n　專案 更新 ${log.projUpd}${log.projSkip.length?`\n　⚠ 找不到對應專案（已略過）：${log.projSkip.join('、')}`:''}`);
  };
  rdr.readAsArrayBuffer(f);
}
